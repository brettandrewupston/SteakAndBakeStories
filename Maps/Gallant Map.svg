<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Spokes from The Roof (where the fourth floor actually lives) -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="465" y1="290" x2="250" y2="290"/>
    <line x1="465" y1="290" x2="465" y2="151"/>
    <line x1="465" y1="290" x2="268" y2="141"/>
    <line x1="465" y1="290" x2="272" y2="431"/>
    <line x1="465" y1="290" x2="465" y2="439"/>
    <line x1="465" y1="290" x2="675" y2="290"/>
    <line x1="465" y1="290" x2="675" y2="154"/>
  </g>
  <!-- Spokes from The Laundry (open all night, nobody repeats anything) -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="465" y1="439" x2="270" y2="531"/>
    <line x1="465" y1="439" x2="675" y2="431"/>
    <line x1="465" y1="439" x2="272" y2="431"/>
    <line x1="465" y1="439" x2="465" y2="576"/>
  </g>
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="675" y1="290" x2="675" y2="431"/>
    <line x1="465" y1="576" x2="675" y2="576"/>
  </g>
  <!-- The Blackout Block has no coverage; its path is drawn severed -->
  <g stroke="#5c3436" stroke-width="2" stroke-dasharray="3 9">
    <line x1="752" y1="320" x2="820" y2="600"/>
  </g>
  <!-- Ganymede Lobby -->
  <g>
    <rect id="loc-ganymede-lobby" class="sg-map-building" x="170" y="255" width="160" height="70" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="250" y="295" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Ganymede Lobby</text>
  </g>
  <!-- The Roof -->
  <g>
    <rect id="loc-the-roof" class="sg-map-building" x="380" y="250" width="170" height="80" rx="8" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="465" y="295" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">The Roof</text>
  </g>
  <!-- Your Room -->
  <g>
    <rect id="loc-your-room" class="sg-map-building" x="390" y="120" width="150" height="62" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="465" y="156" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Your Room</text>
  </g>
  <!-- Fourth Floor Corridor -->
  <g>
    <rect id="loc-fourth-floor-corridor" class="sg-map-building" x="180" y="110" width="175" height="62" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="268" y="137" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Fourth Floor</text>
    <text x="268" y="155" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Corridor</text>
  </g>
  <!-- The Laundry -->
  <g>
    <rect id="loc-the-laundry" class="sg-map-building" x="380" y="400" width="170" height="78" rx="8" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="465" y="444" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">The Laundry</text>
  </g>
  <!-- GPA Field Office -->
  <g>
    <rect id="loc-gpa-field-office" class="sg-map-building" x="190" y="400" width="165" height="62" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="272" y="436" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">GPA Field Office</text>
  </g>
  <!-- Clement Street -->
  <g>
    <rect id="loc-clement-street" class="sg-map-building" x="600" y="255" width="150" height="70" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="675" y="295" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Clement Street</text>
  </g>
  <!-- The Rotunda -->
  <g>
    <rect id="loc-the-rotunda" class="sg-map-building" x="600" y="120" width="150" height="68" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="675" y="159" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Rotunda</text>
  </g>
  <!-- Cardinal Plaza -->
  <g>
    <rect id="loc-cardinal-plaza" class="sg-map-building sg-map-alist" x="390" y="545" width="150" height="62" rx="8" fill="#26221a" stroke="#a8894a" stroke-width="2"/>
    <text x="465" y="581" text-anchor="middle" fill="#efe0bd" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Cardinal Plaza</text>
  </g>
  <!-- Altitude -->
  <g>
    <rect id="loc-altitude" class="sg-map-building sg-map-alist" x="600" y="545" width="150" height="62" rx="8" fill="#26221a" stroke="#a8894a" stroke-width="2"/>
    <text x="675" y="581" text-anchor="middle" fill="#efe0bd" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Altitude</text>
  </g>
  <!-- The Depot -->
  <g>
    <rect id="loc-the-depot" class="sg-map-building" x="195" y="500" width="150" height="62" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="270" y="536" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Depot</text>
  </g>
  <!-- The Walk-In -->
  <g>
    <rect id="loc-the-walk-in" class="sg-map-building" x="600" y="400" width="150" height="62" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="675" y="436" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Walk-In</text>
  </g>
  <!-- The Blackout Block -->
  <g>
    <rect id="loc-the-blackout-block" class="sg-map-building" x="760" y="578" width="130" height="70" rx="8" fill="#26191c" stroke="#a54a4a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="825" y="609" text-anchor="middle" fill="#e8b8b8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Blackout</text>
    <text x="825" y="627" text-anchor="middle" fill="#e8b8b8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Block</text>
  </g>
</svg>
