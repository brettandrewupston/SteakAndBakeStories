<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Paths from the Pool Deck hub to each location -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="400" y1="300" x2="400" y2="120"/>
    <line x1="400" y1="300" x2="630" y2="285"/>
    <line x1="400" y1="300" x2="705" y2="90"/>
    <line x1="400" y1="300" x2="115" y2="90"/>
    <line x1="400" y1="300" x2="400" y2="438"/>
    <line x1="400" y1="300" x2="590" y2="430"/>
    <line x1="400" y1="300" x2="175" y2="288"/>
    <line x1="400" y1="300" x2="130" y2="530"/>
    <line x1="400" y1="300" x2="735" y2="425"/>
    <line x1="400" y1="300" x2="135" y2="182"/>
  </g>
  <!-- The Sunken Villa is fenced off — its path is drawn severed -->
  <g stroke="#5c3436" stroke-width="2" stroke-dasharray="3 9">
    <line x1="400" y1="300" x2="695" y2="525"/>
  </g>

  <!-- Resort Lobby -->
  <g>
    <rect id="loc-resort-lobby" class="sg-map-building" x="320" y="80" width="160" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="400" y="125" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Resort Lobby</text>
  </g>
  <!-- Pool Deck -->
  <g>
    <rect id="loc-pool-deck" class="sg-map-building" x="310" y="255" width="180" height="90" rx="10" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="400" y="306" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Pool Deck</text>
  </g>
  <!-- Pool Bar -->
  <g>
    <rect id="loc-pool-bar" class="sg-map-building" x="560" y="250" width="140" height="70" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="630" y="290" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Pool Bar</text>
  </g>
  <!-- Contestant Villas -->
  <g>
    <rect id="loc-contestant-villas" class="sg-map-building" x="620" y="50" width="170" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="705" y="86" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Contestant</text>
    <text x="705" y="104" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Villas</text>
  </g>
  <!-- Staff Quarters -->
  <g>
    <rect id="loc-staff-quarters" class="sg-map-building" x="30" y="50" width="170" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="115" y="95" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Staff Quarters</text>
  </g>
  <!-- The Site -->
  <g>
    <rect id="loc-the-site" class="sg-map-building" x="310" y="395" width="180" height="85" rx="8" fill="#22261c" stroke="#8a9a5b" stroke-width="2"/>
    <text x="400" y="443" text-anchor="middle" fill="#dfe8c8" font-family="system-ui, sans-serif" font-size="16">The Site</text>
  </g>
  <!-- Tool Shed -->
  <g>
    <rect id="loc-tool-shed" class="sg-map-building" x="530" y="400" width="120" height="60" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="590" y="435" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="13">Tool Shed</text>
  </g>
  <!-- Confessional Booth -->
  <g>
    <rect id="loc-confessional-booth" class="sg-map-building" x="100" y="250" width="150" height="75" rx="8" fill="#232637" stroke="#c9a869" stroke-width="2"/>
    <text x="175" y="283" text-anchor="middle" fill="#f0dcb0" font-family="system-ui, sans-serif" font-size="14">Confessional</text>
    <text x="175" y="301" text-anchor="middle" fill="#f0dcb0" font-family="system-ui, sans-serif" font-size="14">Booth</text>
  </g>
  <!-- Beach -->
  <g>
    <rect id="loc-beach" class="sg-map-building" x="40" y="500" width="180" height="60" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="130" y="535" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Beach</text>
  </g>
  <!-- Outdoor Showers -->
  <g>
    <rect id="loc-outdoor-showers" class="sg-map-building" x="670" y="395" width="130" height="60" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="735" y="421" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="13">Outdoor</text>
    <text x="735" y="438" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="13">Showers</text>
  </g>
  <!-- Manager's Office -->
  <g>
    <rect id="loc-manager-s-office" class="sg-map-building" x="60" y="150" width="150" height="65" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="135" y="187" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="13">Manager's Office</text>
  </g>
  <!-- The Sunken Villa -->
  <g>
    <rect id="loc-the-sunken-villa" class="sg-map-building" x="600" y="490" width="190" height="70" rx="8" fill="#26191c" stroke="#a54a4a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="695" y="530" text-anchor="middle" fill="#e8b8b8" font-family="system-ui, sans-serif" font-size="14">The Sunken Villa</text>
  </g>
</svg>
