<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Paths from the Mess Hall hub to each deck -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="450" y1="325" x2="450" y2="125"/>
    <line x1="450" y1="325" x2="680" y2="125"/>
    <line x1="450" y1="325" x2="225" y2="125"/>
    <line x1="450" y1="325" x2="670" y2="272"/>
    <line x1="450" y1="325" x2="220" y2="272"/>
    <line x1="450" y1="325" x2="230" y2="460"/>
    <line x1="450" y1="325" x2="650" y2="460"/>
    <line x1="450" y1="325" x2="450" y2="530"/>
    <line x1="450" y1="325" x2="280" y2="520"/>
  </g>

  <!-- Cargo Bay to its EVA Bay annex; not a hub spoke -->
  <g stroke="#a54a4a" stroke-width="2" stroke-dasharray="4 4">
    <line x1="535" y1="567" x2="585" y2="567"/>
  </g>

  <!-- Mess Hall (hub, social gathering deck) -->
  <g>
    <rect id="loc-mess-hall" class="sg-map-building" x="360" y="280" width="180" height="90" rx="10" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="450" y="330" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Mess Hall</text>
  </g>

  <!-- Bridge -->
  <g>
    <rect id="loc-bridge" class="sg-map-building" x="365" y="50" width="170" height="75" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="450" y="92" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Bridge</text>
  </g>

  <!-- Captain's Ready Room -->
  <g>
    <rect id="loc-captain-s-ready-room" class="sg-map-building" x="590" y="50" width="180" height="75" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="680" y="80" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Captain's</text>
    <text x="680" y="100" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Ready Room</text>
  </g>

  <!-- Observation Deck -->
  <g>
    <rect id="loc-observation-deck" class="sg-map-building" x="140" y="50" width="170" height="75" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="225" y="92" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Observation Deck</text>
  </g>

  <!-- Science Lab -->
  <g>
    <rect id="loc-science-lab" class="sg-map-building" x="670" y="230" width="170" height="85" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="755" y="278" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Science Lab</text>
  </g>

  <!-- Medbay -->
  <g>
    <rect id="loc-medbay" class="sg-map-building" x="60" y="230" width="160" height="85" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="140" y="278" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Medbay</text>
  </g>

  <!-- Crew Quarters -->
  <g>
    <rect id="loc-crew-quarters" class="sg-map-building" x="60" y="420" width="170" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="145" y="465" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Crew Quarters</text>
  </g>

  <!-- Engineering Bay -->
  <g>
    <rect id="loc-engineering-bay" class="sg-map-building" x="650" y="420" width="180" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="740" y="465" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Engineering Bay</text>
  </g>

  <!-- Cargo Bay (where the escape pod was recovered) -->
  <g>
    <rect id="loc-cargo-bay" class="sg-map-building" x="365" y="530" width="170" height="75" rx="8" fill="#26191c" stroke="#a54a4a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="450" y="572" text-anchor="middle" fill="#e8b8b8" font-family="system-ui, sans-serif" font-size="15">Cargo Bay</text>
  </g>

  <!-- Sonic Showers (wet location, adjacent to the Atrium) -->
  <g>
    <rect id="loc-sonic-showers" class="sg-map-building" x="55" y="520" width="140" height="70" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="125" y="560" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Sonic Showers</text>
  </g>

  <!-- The Atrium (wet location) -->
  <g>
    <rect id="loc-the-atrium" class="sg-map-building" x="205" y="520" width="150" height="70" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="280" y="560" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Atrium</text>
  </g>

  <!-- EVA Bay (airlock; posted watch station off the Cargo Bay) -->
  <g>
    <rect id="loc-eva-bay" class="sg-map-building" x="585" y="530" width="150" height="75" rx="8" fill="#26191c" stroke="#a54a4a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="660" y="572" text-anchor="middle" fill="#e8b8b8" font-family="system-ui, sans-serif" font-size="15">EVA Bay</text>
  </g>

</svg>
