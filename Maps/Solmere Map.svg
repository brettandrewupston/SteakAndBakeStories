<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Paths from the Courtyard hub to each location -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="400" y1="305" x2="400" y2="170"/>
    <line x1="400" y1="305" x2="620" y2="275"/>
    <line x1="400" y1="305" x2="220" y2="275"/>
    <line x1="400" y1="305" x2="400" y2="400"/>
    <line x1="400" y1="305" x2="595" y2="460"/>
    <line x1="400" y1="305" x2="685" y2="140"/>
    <line x1="400" y1="305" x2="115" y2="140"/>
    <line x1="400" y1="305" x2="200" y2="465"/>
  </g>

  <!-- Courtyard (hub, open area) -->
  <g>
    <rect id="loc-courtyard" class="sg-map-building" x="310" y="260" width="180" height="90" rx="10" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="400" y="310" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Courtyard</text>
  </g>

  <!-- Enrollment Hall -->
  <g>
    <rect id="loc-enrollment-hall" class="sg-map-building" x="320" y="90" width="160" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="400" y="135" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Enrollment Hall</text>
  </g>

  <!-- Dueling Arena -->
  <g>
    <rect id="loc-dueling-arena" class="sg-map-building" x="580" y="230" width="170" height="90" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="665" y="280" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Dueling Arena</text>
  </g>

  <!-- Library -->
  <g>
    <rect id="loc-library" class="sg-map-building" x="50" y="230" width="170" height="90" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="135" y="280" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Library</text>
  </g>

  <!-- Training Grounds -->
  <g>
    <rect id="loc-training-grounds" class="sg-map-building" x="320" y="400" width="160" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="400" y="445" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">Training Grounds</text>
  </g>

  <!-- Athletics cluster: Pool / Showers / Staff Room -->
  <g>
    <rect id="loc-pool" class="sg-map-building" x="540" y="430" width="110" height="60" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="595" y="465" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="13">Pool</text>
  </g>
  <g>
    <rect id="loc-showers" class="sg-map-building" x="540" y="500" width="110" height="55" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="595" y="532" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="13">Showers</text>
  </g>
  <g>
    <rect id="loc-staff-room" class="sg-map-building" x="660" y="430" width="110" height="60" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="715" y="465" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="13">Staff Room</text>
  </g>

  <!-- Royal Dormitory Wing -->
  <g>
    <rect id="loc-royal-dormitory-wing" class="sg-map-building" x="600" y="60" width="170" height="80" rx="8" fill="#232637" stroke="#c9a869" stroke-width="2"/>
    <text x="685" y="95" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Royal Dormitory</text>
    <text x="685" y="115" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Wing</text>
  </g>

  <!-- Commoner Dormitory Wing -->
  <g>
    <rect id="loc-commoner-dormitory-wing" class="sg-map-building" x="30" y="60" width="170" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="115" y="95" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Commoner</text>
    <text x="115" y="115" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Dormitory Wing</text>
  </g>

  <!-- Restricted Wing -->
  <g>
    <rect id="loc-restricted-wing" class="sg-map-building" x="60" y="430" width="150" height="70" rx="8" fill="#26191c" stroke="#a54a4a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="135" y="470" text-anchor="middle" fill="#e8b8b8" font-family="system-ui, sans-serif" font-size="14">Restricted Wing</text>
  </g>
</svg>
