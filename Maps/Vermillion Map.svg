<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- The Vermillion: six storeys, drawn as a stack. Everything inside this
       outline is sealed on the first night. -->
  <rect x="26" y="42" width="418" height="512" rx="12" fill="#191b26" stroke="#3a2f38" stroke-width="2"/>
  <text x="235" y="30" text-anchor="middle" fill="#8c6b74" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">THE VERMILLION</text>
  <text x="920" y="30" text-anchor="end" fill="#5f6480" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">CALDER BAY</text>

  <!-- Spokes from The Supper Club Floor (the night-one hub) -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="235" y1="392" x2="135" y2="297"/>
    <line x1="235" y1="392" x2="335" y2="297"/>
    <line x1="235" y1="392" x2="135" y2="497"/>
    <line x1="235" y1="392" x2="335" y2="497"/>
    <line x1="235" y1="392" x2="135" y2="197"/>
    <line x1="235" y1="392" x2="335" y2="197"/>
    <line x1="235" y1="392" x2="235" y2="598"/>
  </g>
  <!-- Spokes from The Alley (the only six square metres nobody has bought) -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="235" y1="598" x2="135" y2="497"/>
    <line x1="235" y1="598" x2="335" y2="497"/>
  </g>
  <!-- The city: reachable from the alley doors, and not before dawn -->
  <g stroke="#4a4f6a" stroke-width="2">
    <path d="M325 598 H500 V310" fill="none"/>
  </g>
  <g stroke="#4a4f6a" stroke-width="2" stroke-dasharray="6 5">
    <line x1="500" y1="138" x2="620" y2="138"/>
    <line x1="500" y1="238" x2="620" y2="238"/>
    <line x1="500" y1="338" x2="620" y2="338"/>
    <line x1="500" y1="448" x2="620" y2="448"/>
    <line x1="500" y1="548" x2="620" y2="548"/>
    <path d="M500 310 V548" fill="none"/>
    <path d="M500 310 V138" fill="none"/>
  </g>

  <!-- The office is off every plan the building has: its path is drawn severed -->
  <g stroke="#6d353c" stroke-width="2" stroke-dasharray="3 9">
    <line x1="150" y1="170" x2="215" y2="126"/>
  </g>

  <!-- The Cardinal's Office (crime scene) -->
  <g>
    <rect id="loc-the-cardinal-s-office" class="sg-map-building" x="140" y="70" width="190" height="56" rx="8" fill="#2a1b1f" stroke="#7a3f45" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="235" y="94" text-anchor="middle" fill="#e9c8cc" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Cardinal's</text>
    <text x="235" y="112" text-anchor="middle" fill="#e9c8cc" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Office</text>
  </g>
  <!-- The Private Booths -->
  <g>
    <rect id="loc-the-private-booths" class="sg-map-building" x="50" y="170" width="170" height="54" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="135" y="203" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Private Booths</text>
  </g>
  <!-- The Grotto -->
  <g>
    <rect id="loc-the-grotto" class="sg-map-building" x="250" y="170" width="170" height="54" rx="8" fill="#16303a" stroke="#3f7f92" stroke-width="2"/>
    <text x="335" y="203" text-anchor="middle" fill="#cfe9f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Grotto</text>
  </g>
  <!-- The Chorus Room -->
  <g>
    <rect id="loc-the-chorus-room" class="sg-map-building" x="50" y="270" width="170" height="54" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="135" y="303" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Chorus Room</text>
  </g>
  <!-- The Casino Floor -->
  <g>
    <rect id="loc-the-casino-floor" class="sg-map-building" x="250" y="270" width="170" height="54" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="335" y="303" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Casino Floor</text>
  </g>
  <!-- The Supper Club Floor (starting location, hub) -->
  <g>
    <rect id="loc-the-supper-club-floor" class="sg-map-building" x="140" y="360" width="190" height="64" rx="8" fill="#2b2130" stroke="#8a5f6b" stroke-width="2"/>
    <text x="235" y="386" text-anchor="middle" fill="#f2e3e6" font-family="system-ui, sans-serif" font-size="14" font-weight="500">The Supper Club</text>
    <text x="235" y="404" text-anchor="middle" fill="#f2e3e6" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Floor</text>
  </g>
  <!-- The Galley -->
  <g>
    <rect id="loc-the-galley" class="sg-map-building" x="50" y="470" width="170" height="54" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="135" y="503" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Galley</text>
  </g>
  <!-- The Count Room -->
  <g>
    <rect id="loc-the-count-room" class="sg-map-building" x="250" y="470" width="170" height="54" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="335" y="503" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Count Room</text>
  </g>
  <!-- The Alley (outside the building, second hub) -->
  <g>
    <rect id="loc-the-alley" class="sg-map-building sg-map-uncovered" x="145" y="570" width="180" height="56" rx="8" fill="#1b2622" stroke="#4f7a63" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="235" y="604" text-anchor="middle" fill="#cfe6d8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Alley</text>
  </g>

  <!-- Carrow House -->
  <g>
    <rect id="loc-carrow-house" class="sg-map-building" x="620" y="110" width="230" height="56" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="735" y="144" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Carrow House</text>
  </g>
  <!-- The Ambrosia Baths -->
  <g>
    <rect id="loc-the-ambrosia-baths" class="sg-map-building" x="620" y="210" width="230" height="56" rx="8" fill="#16303a" stroke="#3f7f92" stroke-width="2"/>
    <text x="735" y="244" text-anchor="middle" fill="#cfe9f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Ambrosia Baths</text>
  </g>
  <!-- Carbone and Sons -->
  <g>
    <rect id="loc-carbone-and-sons" class="sg-map-building" x="620" y="310" width="230" height="56" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="735" y="344" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Carbone and Sons</text>
  </g>
  <!-- The Bellandi Social Club -->
  <g>
    <rect id="loc-the-bellandi-social-club" class="sg-map-building" x="620" y="420" width="230" height="56" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="735" y="443" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Bellandi</text>
    <text x="735" y="461" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Social Club</text>
  </g>
  <!-- The Precinct -->
  <g>
    <rect id="loc-the-precinct" class="sg-map-building" x="620" y="520" width="230" height="56" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="735" y="554" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Precinct</text>
  </g>
</svg>
