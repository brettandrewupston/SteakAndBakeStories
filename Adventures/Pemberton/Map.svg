<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Spokes from The Floor (the open-plan hub) -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="465" y1="290" x2="250" y2="290"/>
    <line x1="465" y1="290" x2="465" y2="151"/>
    <line x1="465" y1="290" x2="268" y2="141"/>
    <line x1="465" y1="290" x2="270" y2="431"/>
    <line x1="465" y1="290" x2="465" y2="439"/>
    <line x1="465" y1="290" x2="675" y2="290"/>
    <line x1="465" y1="290" x2="675" y2="154"/>
  </g>
  <!-- Spokes from The Kitchen (where the branch actually decides things) -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="465" y1="439" x2="270" y2="531"/>
    <line x1="465" y1="439" x2="675" y2="431"/>
    <line x1="465" y1="439" x2="270" y2="431"/>
  </g>
  <!-- The front doors: the only way out of the building -->
  <g stroke="#6b7196" stroke-width="3">
    <line x1="175" y1="290" x2="80" y2="91"/>
    <line x1="175" y1="290" x2="80" y2="501"/>
  </g>
  <!-- The Overflow is not on the site plan; its path is drawn severed -->
  <g stroke="#5c3436" stroke-width="2" stroke-dasharray="3 9">
    <line x1="740" y1="325" x2="808" y2="581"/>
  </g>

  <!-- The Smoking Shelter -->
  <g>
    <rect id="loc-the-smoking-shelter" class="sg-map-building sg-map-uncovered" x="10" y="60" width="140" height="62" rx="8" fill="#1b2622" stroke="#4f7a63" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="80" y="88" text-anchor="middle" fill="#cfe6d8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Smoking</text>
    <text x="80" y="106" text-anchor="middle" fill="#cfe6d8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Shelter</text>
  </g>
  <!-- The Car Park -->
  <g>
    <rect id="loc-the-car-park" class="sg-map-building sg-map-uncovered" x="10" y="470" width="140" height="62" rx="8" fill="#1b2622" stroke="#4f7a63" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="80" y="506" text-anchor="middle" fill="#cfe6d8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Car Park</text>
  </g>
  <!-- Meeting Room 2 -->
  <g>
    <rect id="loc-meeting-room-2" class="sg-map-building" x="190" y="110" width="155" height="62" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="268" y="146" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Meeting Room 2</text>
  </g>
  <!-- Reception -->
  <g>
    <rect id="loc-reception" class="sg-map-building" x="175" y="255" width="150" height="70" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="250" y="295" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Reception</text>
  </g>
  <!-- The Stairwell -->
  <g>
    <rect id="loc-the-stairwell" class="sg-map-building" x="195" y="400" width="150" height="62" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="270" y="436" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Stairwell</text>
  </g>
  <!-- The Archive -->
  <g>
    <rect id="loc-the-archive" class="sg-map-building" x="195" y="500" width="150" height="62" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="270" y="536" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Archive</text>
  </g>
  <!-- Your Office -->
  <g>
    <rect id="loc-your-office" class="sg-map-building" x="390" y="120" width="150" height="62" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="465" y="156" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Your Office</text>
  </g>
  <!-- The Floor -->
  <g>
    <rect id="loc-the-floor" class="sg-map-building" x="380" y="250" width="170" height="80" rx="8" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="465" y="295" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">The Floor</text>
  </g>
  <!-- The Kitchen -->
  <g>
    <rect id="loc-the-kitchen" class="sg-map-building" x="380" y="400" width="170" height="78" rx="8" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="465" y="444" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">The Kitchen</text>
  </g>
  <!-- The Line -->
  <g>
    <rect id="loc-the-line" class="sg-map-building" x="600" y="120" width="150" height="68" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="675" y="159" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Line</text>
  </g>
  <!-- Dispatch -->
  <g>
    <rect id="loc-dispatch" class="sg-map-building" x="600" y="255" width="150" height="70" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="675" y="295" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Dispatch</text>
  </g>
  <!-- The Cupboard -->
  <g>
    <rect id="loc-the-cupboard" class="sg-map-building sg-map-uncovered" x="600" y="400" width="150" height="62" rx="8" fill="#1b2622" stroke="#4f7a63" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="675" y="436" text-anchor="middle" fill="#cfe6d8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Cupboard</text>
  </g>
  <!-- The Overflow -->
  <g>
    <rect id="loc-the-overflow" class="sg-map-building" x="730" y="545" width="155" height="72" rx="8" fill="#26191c" stroke="#a54a4a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="808" y="586" text-anchor="middle" fill="#e8b8b8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Overflow</text>
  </g>
</svg>
