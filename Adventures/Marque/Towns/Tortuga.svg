<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Paths from the beach market, the island's centre of trade, to the rest of Tortuga -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="450" y1="325" x2="195" y2="87"/>
    <line x1="450" y1="325" x2="705" y2="87"/>
    <line x1="450" y1="325" x2="165" y2="272"/>
    <line x1="450" y1="325" x2="735" y2="272"/>
    <line x1="450" y1="325" x2="465" y2="540"/>
  </g>

  <!-- The Beach Market (hub) -->
  <g>
    <rect id="loc-the-beach-market" class="sg-map-building" x="355" y="280" width="190" height="90" rx="10" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="450" y="331" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">The Beach Market</text>
  </g>

  <!-- The Ropewalk -->
  <g>
    <rect id="loc-the-ropewalk" class="sg-map-building" x="100" y="50" width="190" height="75" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="195" y="93" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Ropewalk</text>
  </g>

  <!-- The Careening Yard -->
  <g>
    <rect id="loc-the-careening-yard" class="sg-map-building" x="610" y="50" width="190" height="75" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="705" y="83" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">The Careening</text>
    <text x="705" y="103" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Yard</text>
  </g>

  <!-- The Landing -->
  <g>
    <rect id="loc-the-landing" class="sg-map-building" x="70" y="230" width="190" height="85" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="165" y="278" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Landing</text>
  </g>

  <!-- The Fort -->
  <g>
    <rect id="loc-the-fort" class="sg-map-building" x="640" y="230" width="190" height="85" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="735" y="278" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Fort</text>
  </g>

  <!-- The Burying Ground -->
  <g>
    <rect id="loc-the-burying-ground" class="sg-map-building" x="370" y="500" width="190" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="465" y="536" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">The Burying</text>
    <text x="465" y="556" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Ground</text>
  </g>

</svg>