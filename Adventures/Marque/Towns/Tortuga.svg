<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Paths from the beach market, the island's centre of trade, to the rest of Tortuga -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="450" y1="215" x2="175" y2="80"/>
    <line x1="450" y1="215" x2="720" y2="80"/>
  </g>

  <!-- The Beach Market (hub) -->
  <g>
    <rect id="loc-the-beach-market" class="sg-map-building" x="360" y="170" width="180" height="90" rx="10" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="450" y="221" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">The Beach Market</text>
  </g>

  <!-- The Ropewalk -->
  <g>
    <rect id="loc-the-ropewalk" class="sg-map-building" x="80" y="40" width="190" height="80" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="175" y="86" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Ropewalk</text>
  </g>

  <!-- The Careening Yard -->
  <g>
    <rect id="loc-the-careening-yard" class="sg-map-building" x="620" y="40" width="200" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="720" y="76" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">The Careening</text>
    <text x="720" y="96" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Yard</text>
  </g>

</svg>