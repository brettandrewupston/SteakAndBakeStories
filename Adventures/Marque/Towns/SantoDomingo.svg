<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Paths from the Ozama wharf, where a stranger's papers are read, to the rest of the city -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="450" y1="215" x2="720" y2="80"/>
    <line x1="450" y1="215" x2="175" y2="80"/>
  </g>

  <!-- The Ozama Wharf (hub) -->
  <g>
    <rect id="loc-the-ozama-wharf" class="sg-map-building" x="355" y="170" width="190" height="90" rx="10" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="450" y="221" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">The Ozama Wharf</text>
  </g>

  <!-- The Customs House -->
  <g>
    <rect id="loc-the-customs-house" class="sg-map-building" x="620" y="40" width="200" height="80" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="720" y="76" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">The Customs</text>
    <text x="720" y="96" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">House</text>
  </g>

  <!-- The Cathedral Square -->
  <g>
    <rect id="loc-the-cathedral-square" class="sg-map-building" x="70" y="40" width="210" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="175" y="76" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">The Cathedral</text>
    <text x="175" y="96" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14">Square</text>
  </g>

</svg>