<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Paths from the Company wharf, which everything on the island passes through, to the rest of Curacao -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="450" y1="215" x2="730" y2="80"/>
    <line x1="450" y1="215" x2="180" y2="80"/>
  </g>

  <!-- The Company Wharf (hub) -->
  <g>
    <rect id="loc-the-company-wharf" class="sg-map-building" x="350" y="170" width="200" height="90" rx="10" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="450" y="211" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">The Company</text>
    <text x="450" y="231" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Wharf</text>
  </g>

  <!-- The Dry Dock -->
  <g>
    <rect id="loc-the-dry-dock" class="sg-map-building" x="640" y="40" width="180" height="80" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="730" y="86" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Dry Dock</text>
  </g>

  <!-- The Salt Pans -->
  <g>
    <rect id="loc-the-salt-pans" class="sg-map-building" x="90" y="40" width="180" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="180" y="86" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Salt Pans</text>
  </g>

</svg>