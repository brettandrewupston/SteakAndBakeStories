<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Paths from the Company wharf, which everything on the island passes through, to the rest of Curacao -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="450" y1="325" x2="195" y2="87"/>
    <line x1="450" y1="325" x2="705" y2="87"/>
    <line x1="450" y1="325" x2="165" y2="272"/>
    <line x1="450" y1="325" x2="735" y2="272"/>
    <line x1="450" y1="325" x2="465" y2="540"/>
  </g>

  <!-- The Company Wharf (hub) -->
  <g>
    <rect id="loc-the-company-wharf" class="sg-map-building" x="355" y="280" width="190" height="90" rx="10" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="450" y="321" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">The Company</text>
    <text x="450" y="341" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Wharf</text>
  </g>

  <!-- The Dry Dock -->
  <g>
    <rect id="loc-the-dry-dock" class="sg-map-building" x="100" y="50" width="190" height="75" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="195" y="93" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Dry Dock</text>
  </g>

  <!-- The Warehouses -->
  <g>
    <rect id="loc-the-warehouses" class="sg-map-building" x="610" y="50" width="190" height="75" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="705" y="93" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Warehouses</text>
  </g>

  <!-- The Cooperage -->
  <g>
    <rect id="loc-the-cooperage" class="sg-map-building" x="70" y="230" width="190" height="85" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="165" y="278" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Cooperage</text>
  </g>

  <!-- The Salt Pans -->
  <g>
    <rect id="loc-the-salt-pans" class="sg-map-building" x="640" y="230" width="190" height="85" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="735" y="278" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Salt Pans</text>
  </g>

  <!-- The Wharf Tavern -->
  <g>
    <rect id="loc-the-wharf-tavern" class="sg-map-building" x="370" y="500" width="190" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="465" y="546" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Wharf Tavern</text>
  </g>

</svg>