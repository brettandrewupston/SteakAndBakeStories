<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Paths from the Waist, the open main deck, to the rest of the sloop -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="450" y1="325" x2="695" y2="87"/>
    <line x1="450" y1="325" x2="195" y2="87"/>
    <line x1="450" y1="325" x2="730" y2="272"/>
    <line x1="450" y1="325" x2="160" y2="272"/>
    <line x1="450" y1="325" x2="465" y2="540"/>
  </g>

  <!-- The Waist (hub) -->
  <g>
    <rect id="loc-the-waist" class="sg-map-building" x="360" y="280" width="180" height="90" rx="10" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="450" y="331" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">The Waist</text>
  </g>

  <!-- The Tops -->
  <g>
    <rect id="loc-the-tops" class="sg-map-building" x="610" y="50" width="170" height="75" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="695" y="93" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Tops</text>
  </g>

  <!-- The Great Cabin -->
  <g>
    <rect id="loc-the-great-cabin" class="sg-map-building" x="100" y="50" width="190" height="75" rx="8" fill="#232637" stroke="#6ea8fe" stroke-width="2"/>
    <text x="195" y="93" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Great Cabin</text>
  </g>

  <!-- The Galley -->
  <g>
    <rect id="loc-the-galley" class="sg-map-building" x="640" y="230" width="180" height="85" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="730" y="278" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Galley</text>
  </g>

  <!-- The Berth Deck -->
  <g>
    <rect id="loc-the-berth-deck" class="sg-map-building" x="70" y="230" width="180" height="85" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="160" y="278" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Berth Deck</text>
  </g>

  <!-- The Hold -->
  <g>
    <rect id="loc-the-hold" class="sg-map-building" x="380" y="500" width="170" height="80" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="465" y="546" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="15">The Hold</text>
  </g>

</svg>