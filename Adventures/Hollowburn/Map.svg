<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 640" style="width:100%; height:auto; background:#15161d; border-radius:8px;">
  <!-- Spokes from The Landing (house hub) -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="230" y1="307" x2="230" y2="110"/>
    <line x1="230" y1="307" x2="85" y2="190"/>
    <line x1="230" y1="307" x2="395" y2="190"/>
    <line x1="230" y1="307" x2="135" y2="295"/>
    <line x1="230" y1="307" x2="230" y2="410"/>
    <line x1="230" y1="307" x2="390" y2="400"/>
    <line x1="230" y1="307" x2="135" y2="415"/>
  </g>
  <!-- Spokes from The Cul-de-sac (village hub) -->
  <g stroke="#3a3f58" stroke-width="2" stroke-dasharray="6 5">
    <line x1="675" y1="307" x2="610" y2="185"/>
    <line x1="675" y1="307" x2="780" y2="185"/>
    <line x1="675" y1="307" x2="605" y2="420"/>
  </g>
  <!-- The front door: the only join between the house and the village -->
  <g stroke="#6b7196" stroke-width="3">
    <line x1="310" y1="307" x2="590" y2="307"/>
  </g>
  <!-- The Old Pit Head is fenced off — its path is drawn severed -->
  <g stroke="#5c3436" stroke-width="2" stroke-dasharray="3 9">
    <line x1="675" y1="307" x2="770" y2="530"/>
  </g>

  <!-- Your Bedroom -->
  <g>
    <rect id="loc-your-bedroom" class="sg-map-building" x="150" y="45" width="160" height="65" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="230" y="82" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Your Bedroom</text>
  </g>
  <!-- The Bathroom -->
  <g>
    <rect id="loc-the-bathroom" class="sg-map-building" x="15" y="130" width="140" height="60" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="85" y="165" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Bathroom</text>
  </g>
  <!-- The Box Room -->
  <g>
    <rect id="loc-the-box-room" class="sg-map-building" x="325" y="130" width="140" height="60" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="395" y="165" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Box Room</text>
  </g>
  <!-- Mam and Dad's Room -->
  <g>
    <rect id="loc-mam-and-dad-s-room" class="sg-map-building" x="10" y="250" width="125" height="75" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="72" y="284" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Mam &amp; Dad's</text>
    <text x="72" y="302" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Room</text>
  </g>
  <!-- The Landing -->
  <g>
    <rect id="loc-the-landing" class="sg-map-building" x="150" y="270" width="160" height="75" rx="8" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="230" y="312" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">The Landing</text>
  </g>
  <!-- The Kitchen -->
  <g>
    <rect id="loc-the-kitchen" class="sg-map-building" x="150" y="410" width="160" height="60" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="230" y="445" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Kitchen</text>
  </g>
  <!-- The Sitting Room -->
  <g>
    <rect id="loc-the-sitting-room" class="sg-map-building" x="330" y="400" width="155" height="60" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="407" y="435" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Sitting Room</text>
  </g>
  <!-- The Back Garden -->
  <g>
    <rect id="loc-the-back-garden" class="sg-map-building" x="10" y="400" width="125" height="60" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="72" y="427" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Back</text>
    <text x="72" y="445" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Garden</text>
  </g>
  <!-- The Half Moon Inn -->
  <g>
    <rect id="loc-the-half-moon-inn" class="sg-map-building" x="530" y="120" width="160" height="65" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="610" y="149" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Half Moon</text>
    <text x="610" y="167" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Inn</text>
  </g>
  <!-- The Beach -->
  <g>
    <rect id="loc-the-beach" class="sg-map-building" x="710" y="120" width="140" height="65" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="780" y="157" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Beach</text>
  </g>
  <!-- The Cul-de-sac -->
  <g>
    <rect id="loc-the-cul-de-sac" class="sg-map-building" x="590" y="270" width="170" height="75" rx="8" fill="#232637" stroke="#7c5cff" stroke-width="2"/>
    <text x="675" y="312" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">The Cul-de-sac</text>
  </g>
  <!-- St Aidan's -->
  <g>
    <rect id="loc-st-aidan-s" class="sg-map-building" x="530" y="420" width="150" height="65" rx="8" fill="#232637" stroke="#4a4f6a" stroke-width="2"/>
    <text x="605" y="457" text-anchor="middle" fill="#e8e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="400">St Aidan's</text>
  </g>
  <!-- The Old Pit Head -->
  <g>
    <rect id="loc-the-old-pit-head" class="sg-map-building" x="690" y="530" width="160" height="70" rx="8" fill="#26191c" stroke="#a54a4a" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="770" y="562" text-anchor="middle" fill="#e8b8b8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">The Old Pit</text>
    <text x="770" y="580" text-anchor="middle" fill="#e8b8b8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">Head</text>
  </g>
</svg>
